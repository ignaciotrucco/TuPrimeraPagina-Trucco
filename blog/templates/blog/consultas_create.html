{% extends 'home/base.html' %}

{% block content %}
<!-- Card del formulario -->
<div class="card mb-2">
    <div class="card-header">
        <h5 class="mb-0">Nueva Consulta</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-secondary mt-2 w-auto">Guardar</button>
        </form>
    </div>
</div>
{% endblock content %}
