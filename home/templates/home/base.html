<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | {% block title %} {% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home:index' %}">Mi Sitio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:pacientes' %}">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:turnos' %}">Turnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:consultas' %}">Consultas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:medicamentos' %}">Medicamentos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <h1 class="display-3 text-center my-4 text-dark font-weight-bold" style="font-family: 'Arial', sans-serif;">
            {% block content_title %}
            {% endblock content_title %}
        </h1>
        {% block content %}
        {% endblock content %}
    </div>

    <footer class="bg-dark text-white text-center mt-auto py-3">
        <div class="container">
            <p class="mb-1">&copy; 2025 Desarrollado por Ignacio Trucco</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="https://github.com/ignaciotrucco" class="text-white" target="_blank">
                    <i class="bi bi-github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/in/ignaciotrucco/" class="text-white" target="_blank">
                    <i class="bi bi-linkedin"></i> LinkedIn
                </a>
                <a href="mailto:truccoignacio9@gmail.com" class="text-white">
                    <i class="bi bi-envelope"></i> Gmail
                </a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>


</html>
